<HTML>
<HEAD>
   <META CHARSET="UTF-8">
   <TITLE>Crear Libro</TITLE>
</HEAD>
<BODY>
   <H2>Añadir nuevo libro</H2>
   <FORM ACTION="crealibro.php" METHOD="POST">
      Nombre: <INPUT TYPE="text" NAME="nombre" SIZE="40"><BR><BR>
      Autor: <INPUT TYPE="text" NAME="autor" SIZE="30"><BR><BR>
      ISBN: <INPUT TYPE="text" NAME="isbn" SIZE="15"><BR><BR>
      Puntuación: <INPUT TYPE="text" NAME="puntuacion" SIZE="5"><BR><BR>
      Género: <INPUT TYPE="text" NAME="genero" SIZE="20"><BR><BR>
      <INPUT TYPE="submit" NAME="enviar" VALUE="Guardar libro">
   </FORM>
</BODY>
</HTML>
